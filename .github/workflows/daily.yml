name: daily-intel

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intel
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch sources
        run: python scrapers/run_all.py --out data

      - name: Commit results
        run: |
          git config user.name "ai-intel-bot"
          git config user.email "ai-intel-bot@users.noreply.github.com"
          git add -A data civitai
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: $(date -u +%F)"
            git push
          fi
